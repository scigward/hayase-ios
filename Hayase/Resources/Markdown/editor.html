<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Editor</title>
<style>
  /* The page of the interface: the dark colour scheme and `text-sm` (14px on a line of 20px) */
  html { color-scheme: dark; -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { color: hsl(0 0% 98%); font-size: 14px; line-height: 20px; font-family: -apple-system, sans-serif; }
  /* app.css: the text area has the placeholder (with its lines), OverType's own copy of it is not shown */
  .overtype-placeholder { display: none !important; }
  /* `Markdown`'s box: `border border-input flex overflow-clip bg-transparent`, as big as the dialog gives it */
  #editor { box-sizing: border-box; display: flex; width: 100%; height: 100%; overflow: clip;
            border: 1px solid hsl(0 0% 15%); background: transparent; caret-color: hsl(0 0% 98%); }
</style>
</head>
<body>
<div id="editor"></div>
<script src="overtype.min.js"></script>
<script>
  // The editor of `ui/markdown/markdown.svelte`: the same library, the same options and the same theme.
  (function () {
    const theme = {
      name: 'custom',
      colors: {
        bgPrimary: '#282c34',
        bgSecondary: '#21252b',
        text: '#abb2bf',
        h1: '#e06c75',
        h2: '#e5c07b',
        h3: '#98c379',
        strong: '#e5c07b',
        em: '#c678dd',
        link: '#61afef',
        code: '#98c379',
        codeBg: 'rgba(40, 44, 52, 0.5)',
        blockquote: '#5c6370',
        hr: '#3b4048',
        syntaxMarker: 'rgba(97, 175, 239, 0.5)',
        cursor: '#61afef',
        selection: 'rgba(97, 175, 239, 0.3)',
        listMarker: '#e5c07b',
        toolbarBg: '#21252b',
        toolbarBorder: '#3b4048',
        toolbarIcon: '#abb2bf',
        toolbarHover: '#333842',
        toolbarActive: '#282c34'
      }
    };
    let editor;
    const post = (name, body) => {
      try { window.webkit.messageHandlers[name].postMessage(body); } catch (error) { /* a page that is not in the app */ }
    };
    window.HayaseEditor = {
      mount (value, placeholder) {
        const root = document.getElementById('editor');
        [editor] = new OverType(root, {
          toolbar: true,
          placeholder: placeholder,
          value: value,
          autoResize: false,
          theme: theme,
          onChange: next => post('change', next)
        });
      },
      value () {
        return editor ? editor.getValue() : '';
      }
    };
    post('ready', true);
  })();
</script>
</body>
</html>
