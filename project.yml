name: Hayase

options:
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SDKROOT: iphoneos
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    # CI sets both from scripts/app_version.sh.
    MARKETING_VERSION: "6.4.0"
    CURRENT_PROJECT_VERSION: "0"

packages:
  OpenSSL:
    url: https://github.com/krzyzanowskim/OpenSSL.git
    from: "3.1.5004"
  MPVKit:
    url: https://github.com/Sincereior/MPVKit.git
    exactVersion: "0.41.0-av8"
  matroska-swift:
    url: https://github.com/Smearedo/matroska-swift.git
    branch: main
  WebRTC:
    path: ./Vendor/WebRTC
  NodeMobile:
    path: ./Vendor/NodeMobile
  LucideIcons:
    url: https://github.com/JakubMazur/lucide-icons-swift.git
    from: "1.47.0"
  Starscream:
    url: https://github.com/daltoniam/Starscream.git
    from: "4.0.8"
  CobeKit:
    url: https://github.com/ohwhen/CobeKit.git
    branch: main
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: "2.13.6"
  Xyflow:
    url: https://github.com/scigward/Xyflow-Swift.git
    exactVersion: 1.0.2

targets:
  Hayase:
    type: application
    platform: iOS
    sources:
      - path: Hayase/Source
      - path: Hayase/Hayase-Bridging-Header.h
      - path: CoreDataService/Source
      - path: Hayase/Resources
        excludes:
          - Info.plist
          - WebTorrentBackend/**
          - TorrentClientGeoIP/**
          - RichText/**
          - Twemoji/**
      - path: Hayase/Resources/RichText
        type: folder
        buildPhase: resources
      - path: Hayase/Resources/Twemoji
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Hayase/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.hayase
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Hayase/Hayase-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        HEADER_SEARCH_PATHS:
          - "$(SDKROOT)/usr/include/libxml2"
    dependencies:
      - sdk: libz.tbd
      - package: OpenSSL
      - package: MPVKit
        product: MPVKit-GPL
      - package: matroska-swift
        product: MatroskaSwift
      - package: WebRTC
      - package: NodeMobile
      - package: LucideIcons
      - package: Starscream
      - package: CobeKit
      - package: SwiftSoup
      - package: Xyflow
        product: Xyflow
      - package: Xyflow
        product: XYSystem

    postBuildScripts:
      - name: Embed WebTorrent backend resources
        script: |
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/WebTorrentBackend"
          SRC="${PROJECT_DIR}/Hayase/Resources/WebTorrentBackend"
          if [ -d "${SRC}" ]; then
            mkdir -p "${DEST}"
            rsync -av --delete \
              --exclude=".DS_Store" \
              --exclude="*.node" \
              "${SRC}/" "${DEST}/"
          else
            echo "warning: WebTorrent backend resources not found at ${SRC}, skipping embed"
          fi
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/WebTorrentBackend/webtorrent-bridge.js
      - name: Embed torrent client GeoIP resources
        script: |
          SRC="${PROJECT_DIR}/Hayase/Resources/TorrentClientGeoIP"
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/TorrentClientGeoIP"
          if [ ! -d "${SRC}" ]; then
            echo "error: missing ${SRC}; run scripts/build_torrent_client_geoip.sh before building" >&2
            exit 1
          fi
          mkdir -p "${DEST}"
          rsync -av --delete \
            --exclude=".DS_Store" \
            "${SRC}/" "${DEST}/"
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TorrentClientGeoIP/params.json

schemes:
  Hayase:
    build:
      targets:
        Hayase: all
    run:
      config: Release
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
