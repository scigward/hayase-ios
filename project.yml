name: Hayase

options:
  deploymentTarget:
    iOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES

packages:
  OpenSSL:
    url: https://github.com/krzyzanowskim/OpenSSL.git
    from: "3.1.5004"
  MPVKit:
    url: https://github.com/streamyfin/MPVKit.git
    from: "0.40.0-av"
  matroska-swift:
    url: https://github.com/Smearedo/matroska-swift.git
    branch: main
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    branch: latest
  Starscream:
    url: https://github.com/daltoniam/Starscream.git
    from: "4.0.8"

targets:
  Hayase:
    type: application
    platform: iOS
    sources:
      - path: Hayase/Source
      - path: Hayase/Hayase-Bridging-Header.h
      - path: CoreDataService/Source
      - path: Hayase/Resources/Model.xcdatamodeld
    resources:
      - path: Hayase/Resources/Assets.xcassets
      - path: Hayase/Resources/Base.lproj
      - path: Hayase/Resources/Fonts
    settings:
      base:
        INFOPLIST_FILE: Hayase/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.hayase
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Hayase/Hayase-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Component/**"
        HEADER_SEARCH_PATHS:
          - "$(SDKROOT)/usr/include/libxml2"
    dependencies:
      - framework: LibTorrent.framework
        implicit: true
        embed: true
      - sdk: libz.tbd
      - package: OpenSSL
      - package: MPVKit
        product: MPVKit-GPL
      - package: matroska-swift
        product: MatroskaSwift
      - package: WebRTC
      - package: Starscream

schemes:
  Hayase:
    build:
      targets:
        Hayase: all
    run:
      config: Release
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
