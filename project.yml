name: Hayase

options:
  deploymentTarget:
    iOS: "14.0"

settings:
  base:
    SDKROOT: iphoneos
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES

packages:
  OpenSSL:
    url: https://github.com/krzyzanowskim/OpenSSL.git
    from: "3.1.5004"
  MPVKit:
    url: https://github.com/streamyfin/MPVKit.git
    from: "0.40.0-av"
  matroska-swift:
    url: https://github.com/Smearedo/matroska-swift.git
    branch: main
  WebRTC:
    path: Vendor/WebRTC
  LucideIcons:
    url: https://github.com/JakubMazur/lucide-icons-swift.git
    from: "0.516.0"
  Starscream:
    url: https://github.com/daltoniam/Starscream.git
    from: "4.0.8"

targets:
  Hayase:
    type: application
    platform: iOS
    sources:
      - path: Hayase/Source
      - path: Hayase/Hayase-Bridging-Header.h
      - path: CoreDataService/Source
      - path: Hayase/Resources
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: Hayase/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: app.hayase
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Hayase/Hayase-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Component/**"
        HEADER_SEARCH_PATHS:
          - "$(SDKROOT)/usr/include/libxml2"
    dependencies:
      - framework: LibTorrent.framework
        implicit: true
        embed: false
      - sdk: libz.tbd
      - package: OpenSSL
      - package: MPVKit
        product: MPVKit-GPL
      - package: matroska-swift
        product: MatroskaSwift
      - package: WebRTC
      - package: LucideIcons
      - package: Starscream

    postBuildScripts:
      - name: Embed LibTorrent.framework
        script: |
          DEST="${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          SRC="${BUILT_PRODUCTS_DIR}/LibTorrent.framework"
          if [ -d "${SRC}" ]; then
            mkdir -p "${DEST}"
            rsync -av --delete "${SRC}" "${DEST}/"
            find "${DEST}/LibTorrent.framework" -maxdepth 1 -name "Headers" -type d -exec rm -rf {} + 2>/dev/null || true
            find "${DEST}/LibTorrent.framework" -maxdepth 1 -name "PrivateHeaders" -type d -exec rm -rf {} + 2>/dev/null || true
            find "${DEST}/LibTorrent.framework" -maxdepth 1 -name "Modules" -type d -exec rm -rf {} + 2>/dev/null || true
            find "${DEST}/LibTorrent.framework" -name "*.tbd" -delete 2>/dev/null || true
            if [ "${CODE_SIGNING_REQUIRED}" = "YES" ] && [ -n "${CODE_SIGN_IDENTITY}" ]; then
              codesign --force --sign "${CODE_SIGN_IDENTITY}" "${DEST}/LibTorrent.framework"
            fi
          else
            echo "warning: LibTorrent.framework not found at ${SRC}, skipping embed"
          fi
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(FRAMEWORKS_FOLDER_PATH)/LibTorrent.framework

schemes:
  Hayase:
    build:
      targets:
        Hayase: all
    run:
      config: Release
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
