# Mirrors .github/workflows/build-ipa.yml. Keep the seven build scripts identical.
workflows:
  hayase_unsigned_ipa:
    name: Build IPA
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest
      vars:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1

    triggering:
      events:
        - push

    cache:
      cache_paths:
        - $HOME/.hayase-spm

    scripts:
      - name: Set GitHub-compatible workspace
        script: |
          set -euo pipefail

          # Provider adapter only: subsequent build scripts are identical to GitHub's run blocks.
          printf 'GITHUB_WORKSPACE=%s\n' "$CM_BUILD_DIR" >> "$CM_ENV"

      - name: Install dependencies
        script: |
          set -euo pipefail

          command -v xcodegen >/dev/null || brew install xcodegen
          command -v node >/dev/null || brew install node

      - name: Build WebTorrent backend
        script: |
          set -euo pipefail

          chmod +x ./scripts/build_webtorrent_backend.sh
          ./scripts/build_webtorrent_backend.sh

      - name: Build torrent client GeoIP resources
        script: |
          set -euo pipefail

          chmod +x ./scripts/build_torrent_client_geoip.sh
          ./scripts/build_torrent_client_geoip.sh

      - name: Generate Xcode project
        script: |
          set -euo pipefail

          chmod +x ./scripts/generate_project.sh
          ./scripts/generate_project.sh

          test -d Hayase.xcodeproj
          test -d Hayase.xcworkspace

      - name: Resolve Swift packages
        script: |
          set -euo pipefail

          RESOLVED=false

          for attempt in 1 2 3; do
            echo "Resolve attempt $attempt/3"

            if perl -e 'alarm(300); exec(@ARGV)' -- xcodebuild \
              -workspace Hayase.xcworkspace \
              -scheme Hayase \
              -resolvePackageDependencies \
              -clonedSourcePackagesDirPath "$HOME/.hayase-spm" \
              SYMROOT="$GITHUB_WORKSPACE/build/app"; then
              RESOLVED=true
              break
            fi

            sleep 10
          done

          if [ "$RESOLVED" != "true" ]; then
            echo "Failed to resolve Swift packages"
            exit 1
          fi

      - name: Build Hayase
        script: |
          set -euo pipefail

          chmod +x ./scripts/app_version.sh
          VERSION="$(./scripts/app_version.sh)"
          echo "Building Hayase $VERSION"

          xcodebuild \
            -workspace Hayase.xcworkspace \
            -scheme Hayase \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -skipPackageUpdates \
            -clonedSourcePackagesDirPath "$HOME/.hayase-spm" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${VERSION##*.}" \
            SYMROOT="$GITHUB_WORKSPACE/build/app" \
            clean build

      - name: Package IPA
        script: |
          set -euo pipefail

          APP_PATH="$(find build/app -name 'Hayase.app' -not -path '*/Build/*' | head -1)"

          if [ -z "$APP_PATH" ]; then
            echo "Hayase.app not found"
            find build -maxdepth 6 -type d -name "*.app" || true
            exit 1
          fi

          echo "Found app at: $APP_PATH"

          rm -rf Payload Hayase.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Hayase.app
          zip -r Hayase.ipa Payload

    artifacts:
      - Hayase.ipa

  # Deliberately manual: exporting dependencies is not needed on every IPA push.
  hayase_nyxian_source:
    name: Export Nyxian Source
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
    cache:
      cache_paths:
        - $HOME/.hayase-spm
    scripts:
      - name: Install export tools
        script: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v node >/dev/null || brew install node
          command -v python3 >/dev/null || brew install python
      - name: Test the Nyxian exporter
        script: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_nyxian_export.py' -v
      - name: Build and validate Nyxian source export
        script: |
          set -euo pipefail
          bash ./scripts/export_nyxian_source.sh
    artifacts:
      - build/nyxian-export/Hayase-Nyxian-Source.zip
      - build/nyxian-export/Hayase-Nyxian-Source.zip.sha256
      - build/nyxian-export/export-report.json
      - build/nyxian-export/*.log
