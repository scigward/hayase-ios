name: Export Final App Source

on:
  push:
    branches:
      - "codex/**"

jobs:
  export-final-source:
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build tools
        run: brew install xcodegen node

      - name: Build WebTorrent backend bundle
        run: bash ./scripts/build_webtorrent_backend.sh

      - name: Build GeoIP resources
        run: bash ./scripts/build_torrent_client_geoip.sh

      - name: Generate Xcode project
        run: ./scripts/generate_project.sh

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -workspace Hayase.xcworkspace \
            -scheme Hayase \
            -resolvePackageDependencies \
            SYMROOT=${{ github.workspace }}/build/app

      - name: Build Hayase once to collect generated frameworks/libs
        run: |
          xcodebuild \
            -workspace Hayase.xcworkspace \
            -scheme Hayase \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -skipPackageUpdates \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT=${{ github.workspace }}/build/app \
            clean build

      - name: Fix build artifacts permissions
        run: chmod -R u+rw ${{ github.workspace }}/build/app

      - name: Prepare final source export
        run: |
          set -euo pipefail

          EXPORT_DIR="Hayase-Final-Source"

          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR"

          rsync -a ./ "$EXPORT_DIR/" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "$EXPORT_DIR" \
            --exclude "build" \
            --exclude "DerivedData" \
            --exclude "*.xcuserstate"

          mkdir -p "$EXPORT_DIR/_BuiltDependencies"

          find build/app \
            \( -name "*.framework" -o -name "*.xcframework" -o -name "*.a" -o -name "*.dylib" -o -name "*.swiftmodule" \) \
            -exec cp -R {} "$EXPORT_DIR/_BuiltDependencies/" \; || true

          mkdir -p "$EXPORT_DIR/_BuildProducts"

          APP_PATH="$(find build/app -name 'Hayase.app' -type d | head -1)"
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" "$EXPORT_DIR/_BuildProducts/Hayase.app"
          fi

          tar -czf Hayase-Final-Source.tar.gz "$EXPORT_DIR"

      - name: Upload final source artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hayase-Final-Source
          path: Hayase-Final-Source.tar.gz
          retention-days: 14
          if-no-files-found: error
