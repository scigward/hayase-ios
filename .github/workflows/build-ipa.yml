name: Build Unsigned IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      # Checkout with submodules: recursive so Component/LibTorrent-Swift and its
      # nested Thirdparty/libtorrent are all checked out at the pinned SHAs.
      # fetch-depth: 1 gives shallow clones for speed.
      - name: Checkout (with all submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      # Use the pinned LibTorrent-Swift commit SHA + Xcode version as the cache key.
      # The compiled .a is Xcode-version-specific, so include it to avoid stale hits.
      - name: Get cache key inputs
        id: libsha
        run: |
          SHA=$(git rev-parse HEAD:Component/LibTorrent-Swift)
          XCODE=$(xcodebuild -version | head -1 | tr ' ' '-')
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "xcode=$XCODE" >> $GITHUB_OUTPUT
          echo "LibTorrent-Swift SHA: $SHA  Xcode: $XCODE"

      # Cache both the cmake-generated project AND the compiled libtorrent-rasterbar.a.
      # Both live under libtorrent-build/ so a single cache entry covers both.
      - name: Cache libtorrent build
        id: cache-libtorrent
        uses: actions/cache@v4
        with:
          path: Component/LibTorrent-Swift/libtorrent-build
          key: libtorrent-${{ runner.os }}-${{ steps.libsha.outputs.xcode }}-${{ steps.libsha.outputs.sha }}

      # Boost headers are needed to compile libtorrent (only on a cache miss).
      - name: Install Boost
        if: steps.cache-libtorrent.outputs.cache-hit != 'true'
        run: brew install boost

      # Generate the libtorrent Xcode project via cmake (skip on cache hit).
      # BOOST_ROOT tells cmake's FindBoost where Homebrew installed the headers.
      # cmake bakes those paths into the generated .xcodeproj.
      - name: Generate libtorrent Xcode project (cmake)
        if: steps.cache-libtorrent.outputs.cache-hit != 'true'
        working-directory: Component/LibTorrent-Swift
        run: BOOST_ROOT=$(brew --prefix boost) ./make.sh

      # Compile libtorrent-rasterbar.a for iphoneos arm64 in Release config.
      #
      # WHY this step is needed:
      #   make.sh only generates the cmake Xcode project — it does NOT compile
      #   the C++ static library.  LibTorrent.xcodeproj references the .a as a
      #   direct file path (not a cross-project dependency), so Xcode will NOT
      #   auto-build it when building TheAnimeTool.  We must pre-build it.
      #
      # OUTPUT PATH:
      #   LibTorrent.xcodeproj's linker expects the file at:
      #     Component/LibTorrent-Swift/libtorrent-build/Release/libtorrent-rasterbar.a
      #   We force that exact location via CONFIGURATION_BUILD_DIR.
      #
      # TARGET NAME:
      #   cmake's add_library(torrent-rasterbar ...) creates a target named
      #   'torrent-rasterbar'; cmake prepends 'lib' for the output filename.
      - name: Compile libtorrent-rasterbar.a (iphoneos arm64)
        if: steps.cache-libtorrent.outputs.cache-hit != 'true'
        working-directory: Component/LibTorrent-Swift
        run: |
          PROJECT=$(find libtorrent-build -maxdepth 1 -name "*.xcodeproj" | head -1)
          echo "cmake-generated project: $PROJECT"
          xcodebuild \
            -project "$PROJECT" \
            -target torrent-rasterbar \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR="$(pwd)/libtorrent-build/Release"

      - name: Build TheAnimeTool (Release, no signing)
        run: |
          xcodebuild \
            -project TheAnimeTool.xcodeproj \
            -target TheAnimeTool \
            -configuration Release \
            -sdk iphoneos \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT=${{ github.workspace }}/build/app \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package as unsigned IPA
        run: |
          APP_PATH=$(find build/app -name "TheAnimeTool.app" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/TheAnimeTool.app
          zip -r TheAnimeTool.ipa Payload
          echo "IPA created: $(du -sh TheAnimeTool.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheAnimeTool
          path: TheAnimeTool.ipa
          retention-days: 14
