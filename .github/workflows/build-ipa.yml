name: Build Unsigned IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout (with all submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Boost + OpenSSL
        run: brew install boost openssl@3

      - name: Prepare LibTorrent
        run: OPENSSL_ROOT_DIR=$(brew --prefix openssl@3) ./Component/LibTorrent-Swift/make.sh

      - name: Build TheAnimeTool (Release, no signing)
        run: |
          xcodebuild \
            -workspace TheAnimeTool.xcworkspace \
            -scheme TheAnimeTool \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT=${{ github.workspace }}/build/app \
            clean build

      - name: Package as unsigned IPA
        run: |
          APP_PATH=$(find build/app -name "TheAnimeTool.app" -not -path "*/Build/*" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/TheAnimeTool.app
          zip -r TheAnimeTool.ipa Payload
          echo "IPA created: $(du -sh TheAnimeTool.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheAnimeTool
          path: TheAnimeTool.ipa
          retention-days: 14
