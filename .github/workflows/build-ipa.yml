name: Build Unsigned IPA

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (Release, no signing)
        run: |
          xcodebuild \
            -project TheAnimeTool.xcodeproj \
            -target TheAnimeTool \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package as unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "TheAnimeTool.app" -not -path "*/Debug-*" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/TheAnimeTool.app
          cd build
          zip -r TheAnimeTool-unsigned.ipa Payload
          echo "IPA created: $(du -sh TheAnimeTool-unsigned.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheAnimeTool-unsigned-ipa
          path: build/TheAnimeTool-unsigned.ipa
          retention-days: 14
