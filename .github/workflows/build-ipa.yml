name: Build Unsigned IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      # Cache key = the LibTorrent-Swift submodule's pinned commit SHA (one small file).
      # This is faster than hashing thousands of C++ source files and is invalidated
      # exactly when the submodule pin changes.
      - name: Cache libtorrent build
        id: cache-libtorrent
        uses: actions/cache@v4
        with:
          path: |
            Component/LibTorrent-Swift/libtorrent-build
            build/LibTorrent
          key: libtorrent-${{ runner.os }}-${{ hashFiles('.git/modules/Component/LibTorrent-Swift/HEAD', 'Component/LibTorrent-Swift/make.sh') }}

      - name: Generate libtorrent Xcode project (cmake)
        if: steps.cache-libtorrent.outputs.cache-hit != 'true'
        working-directory: Component/LibTorrent-Swift
        run: ./make.sh

      - name: Build LibTorrent framework
        if: steps.cache-libtorrent.outputs.cache-hit != 'true'
        working-directory: Component/LibTorrent-Swift
        run: |
          xcodebuild \
            -project LibTorrent.xcodeproj \
            -scheme LibTorrent \
            -configuration Release \
            -sdk iphoneos \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT=${{ github.workspace }}/build/LibTorrent \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Restore cmake project from cache (if hit)
        if: steps.cache-libtorrent.outputs.cache-hit == 'true'
        working-directory: Component/LibTorrent-Swift
        run: |
          # cmake project must exist for cross-project reference resolution
          if [ ! -f libtorrent-build/libtorrent.xcodeproj/project.pbxproj ]; then
            ./make.sh
          fi

      - name: Build TheAnimeTool (Release, no signing)
        run: |
          xcodebuild \
            -project TheAnimeTool.xcodeproj \
            -target TheAnimeTool \
            -configuration Release \
            -sdk iphoneos \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT=${{ github.workspace }}/build/app \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            FRAMEWORK_SEARCH_PATHS="${{ github.workspace }}/build/LibTorrent/Release-iphoneos $(inherited)"

      - name: Package as unsigned IPA
        run: |
          APP_PATH=$(find build/app -name "TheAnimeTool.app" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/TheAnimeTool.app
          zip -r TheAnimeTool.ipa Payload
          echo "IPA created: $(du -sh TheAnimeTool.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheAnimeTool
          path: TheAnimeTool.ipa
          retention-days: 14
