name: Build Unsigned IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      # Resolve the current HEAD SHA of XITRIX/LibTorrent-Swift so we can use it
      # as a precise, cheap cache key (no need to hash thousands of C++ files).
      - name: Get LibTorrent-Swift HEAD SHA
        id: libsha
        run: |
          SHA=$(git ls-remote https://github.com/XITRIX/LibTorrent-Swift.git HEAD | cut -f1)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "LibTorrent-Swift HEAD: $SHA"

      # Cache the cmake-generated Xcode project for libtorrent (libtorrent-build/).
      # This directory is all that's needed between runs — the C++ source is
      # re-cloned each time (fast with --depth=1) but compilation is skipped on hit.
      - name: Cache libtorrent CMake build
        id: cache-libtorrent
        uses: actions/cache@v4
        with:
          path: Component/LibTorrent-Swift/libtorrent-build
          key: libtorrent-cmake-${{ runner.os }}-${{ steps.libsha.outputs.sha }}

      # Always clone the Swift wrapper (shallow). Only fetch the C++ libtorrent
      # submodule when we have a cmake cache miss (avoids downloading ~50 MB of
      # C++ source on every cache-hit run).
      - name: Clone LibTorrent-Swift
        run: |
          git clone --depth=1 https://github.com/XITRIX/LibTorrent-Swift.git \
            Component/LibTorrent-Swift
          if [ "${{ steps.cache-libtorrent.outputs.cache-hit }}" != "true" ]; then
            git -C Component/LibTorrent-Swift submodule update --init --recursive --depth=1
          fi

      - name: Generate libtorrent Xcode project (cmake)
        if: steps.cache-libtorrent.outputs.cache-hit != 'true'
        working-directory: Component/LibTorrent-Swift
        run: ./make.sh

      # Xcode resolves the LibTorrent cross-project reference and builds it as a
      # dependency automatically — no separate xcodebuild call needed.
      - name: Build TheAnimeTool (Release, no signing)
        run: |
          xcodebuild \
            -project TheAnimeTool.xcodeproj \
            -target TheAnimeTool \
            -configuration Release \
            -sdk iphoneos \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT=${{ github.workspace }}/build/app \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package as unsigned IPA
        run: |
          APP_PATH=$(find build/app -name "TheAnimeTool.app" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/TheAnimeTool.app
          zip -r TheAnimeTool.ipa Payload
          echo "IPA created: $(du -sh TheAnimeTool.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheAnimeTool
          path: TheAnimeTool.ipa
          retention-days: 14
