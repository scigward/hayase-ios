name: Build Unsigned IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      # Checkout with submodules: recursive so Component/LibTorrent-Swift and its
      # nested Thirdparty/libtorrent are all checked out at the pinned SHAs.
      # fetch-depth: 1 gives shallow clones for speed.
      - name: Checkout (with all submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      # Use the pinned LibTorrent-Swift commit SHA as the cmake cache key so the
      # cmake step is skipped when nothing in LibTorrent-Swift has changed.
      - name: Get pinned LibTorrent-Swift SHA
        id: libsha
        run: |
          SHA=$(git rev-parse HEAD:Component/LibTorrent-Swift)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "LibTorrent-Swift pinned SHA: $SHA"

      # Cache the cmake-generated libtorrent Xcode project.  cmake itself is fast
      # (<30 s) but this avoids any drift between runs.
      - name: Cache libtorrent CMake project
        id: cache-libtorrent
        uses: actions/cache@v4
        with:
          path: Component/LibTorrent-Swift/libtorrent-build
          key: libtorrent-cmake-${{ runner.os }}-${{ steps.libsha.outputs.sha }}

      # Boost is required by libtorrent's CMakeLists.txt (header search + link).
      # Install unconditionally — needed both for cmake and for the C++ compile step.
      - name: Install Boost
        run: brew install boost

      # Generate the libtorrent Xcode project via cmake (skip on cache hit).
      # BOOST_ROOT tells cmake's FindBoost where Homebrew put the headers/libs.
      # cmake bakes the Boost include paths into the generated .xcodeproj.
      - name: Generate libtorrent Xcode project (cmake)
        if: steps.cache-libtorrent.outputs.cache-hit != 'true'
        working-directory: Component/LibTorrent-Swift
        run: BOOST_ROOT=$(brew --prefix boost) ./make.sh

      # Compile libtorrent-rasterbar.a for iOS arm64.
      # make.sh only generates the cmake Xcode project — it does NOT compile the library.
      # LibTorrent.xcodeproj's linker resolves the PBXReferenceProxy BUILT_PRODUCTS_DIR
      # to libtorrent-build/Release/ (no platform suffix) so we force the output there
      # via CONFIGURATION_BUILD_DIR.  This file is included in the cache above.
      - name: Compile libtorrent-rasterbar static library (iOS arm64)
        if: steps.cache-libtorrent.outputs.cache-hit != 'true'
        working-directory: Component/LibTorrent-Swift
        run: |
          xcodebuild \
            -project libtorrent-build/libtorrent.xcodeproj \
            -target libtorrent-rasterbar \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CONFIGURATION_BUILD_DIR="$PWD/libtorrent-build/Release" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build TheAnimeTool (Release, no signing)
        run: |
          xcodebuild \
            -project TheAnimeTool.xcodeproj \
            -target TheAnimeTool \
            -configuration Release \
            -sdk iphoneos \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT=${{ github.workspace }}/build/app \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package as unsigned IPA
        run: |
          APP_PATH=$(find build/app -name "TheAnimeTool.app" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/TheAnimeTool.app
          zip -r TheAnimeTool.ipa Payload
          echo "IPA created: $(du -sh TheAnimeTool.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheAnimeTool
          path: TheAnimeTool.ipa
          retention-days: 14
